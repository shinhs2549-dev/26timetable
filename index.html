<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>양일고 시간표</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --board:#2B3A32; --board-line:#41564B; --chalk:#F1EFE6;
    --paper:#F6F4EE; --paper-alt:#EFECE0;
    --ink:#22261F; --ink-soft:#5B5A4E; --rule:#C9C2AE;
    --brass:#B8863C; --brass-deep:#8F6526; --brass-tint:#FBF3E1;
    --err:#B3402F; --ok:#3A6B47; --today:#E3EADE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);
    font-family:'Pretendard',-apple-system,sans-serif;line-height:1.5;}
  .board{background:var(--board);color:var(--chalk);padding:28px 20px 0;
    border-bottom:6px solid var(--brass-deep);}
  .board-inner{max-width:1080px;margin:0 auto;display:flex;
    justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
  .board-eyebrow{font-size:12.5px;color:#AFC2B4;margin:0 0 4px;}
  .board h1{font-family:'Noto Serif KR',serif;font-weight:700;
    font-size:clamp(24px,3.4vw,34px);margin:0;letter-spacing:-.01em;}
  .who{font-size:13.5px;color:#C9D6CD;text-align:right;}
  .who strong{color:var(--chalk);}
  nav.tabs{max-width:1080px;margin:20px auto 0;display:flex;gap:2px;
    border-bottom:1px solid var(--board-line);overflow-x:auto;}
  nav.tabs button{background:none;border:none;color:#AEC0B4;
    font-family:inherit;font-size:14.5px;font-weight:600;padding:10px 15px;
    cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
    white-space:nowrap;}
  nav.tabs button.active{color:var(--chalk);border-bottom:2px solid var(--brass);}
  main{max-width:1080px;margin:0 auto;padding:26px 20px 80px;}
  .panel{display:none;} .panel.active{display:block;}
  h2.sec{font-family:'Noto Serif KR',serif;font-size:18px;margin:0 0 12px;}
  h3.sub{font-family:'Noto Serif KR',serif;font-size:15.5px;margin:26px 0 10px;}
  p.hint{font-size:13px;color:var(--ink-soft);margin:0 0 16px;}

  select,input[type=text],input[type=password]{font-family:inherit;font-size:15px;
    padding:8px 11px;border:1px solid var(--rule);background:#fff;color:var(--ink);
    border-radius:2px;}
  .btn{font-family:inherit;font-weight:700;font-size:14px;padding:9px 18px;
    border-radius:2px;border:none;cursor:pointer;}
  .btn-primary{background:var(--board);color:var(--chalk);}
  .btn-primary:hover{background:#38493F;}
  .btn-ghost{background:#fff;border:1px solid var(--rule);color:var(--ink-soft);}
  .btn-danger{background:#fff;border:1px solid var(--err);color:var(--err);}
  .btn-sm{padding:6px 12px;font-size:13px;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .status{font-size:13px;min-height:18px;margin-left:4px;}
  .status.ok{color:var(--ok);} .status.err{color:var(--err);}

  /* 로그인 */
  .login-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;}
  .spinner{width:28px;height:28px;margin:0 auto 14px;border:3px solid var(--rule);
    border-top-color:var(--brass);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .card{max-width:400px;width:100%;padding:30px;background:#fff;
    border:1px solid var(--rule);}
  .card h2{font-family:'Noto Serif KR',serif;font-size:21px;margin:0 0 4px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
  .field input,.field select{width:100%;}
  .login-note{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule);
    font-size:12.5px;color:var(--ink-soft);line-height:1.7;}
  .login-note code{background:var(--paper-alt);padding:1px 5px;font-size:12px;}

  /* 시간표 */
  table.tt{width:100%;border-collapse:collapse;background:#fff;table-layout:fixed;}
  table.tt th,table.tt td{border:1px solid var(--rule);padding:7px 4px;
    text-align:center;vertical-align:middle;}
  table.tt thead th{background:var(--paper-alt);font-weight:700;
    color:var(--ink-soft);font-size:13px;}
  table.tt th.pcol{width:46px;background:var(--paper-alt);font-weight:700;
    color:var(--ink-soft);font-size:12px;line-height:1.25;}
  table.tt th.pcol small{display:block;font-weight:400;font-size:10px;color:#8A8877;}
  table.tt td{height:66px;}
  td.today{background:var(--today);}
  td.move{background:var(--brass-tint);}
  .c-subj{font-weight:600;font-size:13.5px;line-height:1.25;}
  .c-tea{color:var(--ink-soft);font-size:11px;margin-top:2px;}
  .c-room{font-size:10.5px;margin-top:2px;color:#8A8877;}
  td.move .c-room{color:var(--brass-deep);font-weight:700;}
  .c-none{color:#C7C2B2;font-size:13px;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;
    color:var(--ink-soft);margin-top:10px;}
  .legend i{display:inline-block;width:11px;height:11px;vertical-align:-1px;
    margin-right:5px;border:1px solid var(--rule);}

  /* 선택과목 */
  .block{background:#fff;border:1px solid var(--rule);padding:15px 16px;
    margin-bottom:12px;}
  .block-head{display:flex;justify-content:space-between;gap:10px;
    align-items:baseline;flex-wrap:wrap;margin-bottom:10px;}
  .block-title{font-weight:700;font-size:14.5px;}
  .block-when{font-size:12px;color:var(--ink-soft);}
  .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;}
  .opt{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;
    border:1px solid var(--rule);cursor:pointer;background:var(--paper);}
  .opt.sel{border-color:var(--brass);background:var(--brass-tint);}
  .opt input{margin-top:3px;}
  .opt .o-name{font-weight:600;font-size:13.5px;}
  .opt .o-meta{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}

  /* 목록 */
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;}
  .list button{font-family:inherit;font-size:13.5px;padding:9px;background:#fff;
    border:1px solid var(--rule);cursor:pointer;text-align:left;}
  .list button:hover{border-color:var(--brass);}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px;}
  .chips button{font-family:inherit;font-size:13.5px;font-weight:600;padding:6px 12px;
    border:1px solid var(--rule);background:#fff;color:var(--ink-soft);cursor:pointer;}
  .chips button.active{background:var(--board);border-color:var(--board);color:var(--chalk);}

  .edit-in{width:100%;border:none;background:transparent;text-align:center;
    font-family:inherit;font-size:12px;padding:1px 0;border-bottom:1px solid transparent;}
  .edit-in:focus{outline:none;border-bottom:1px solid var(--brass);background:#FBF8EF;}
  .edit-in.small{font-size:10.5px;color:var(--ink-soft);}
  .slotgrid{border-collapse:collapse;margin:8px 0 4px;}
  .slotgrid th,.slotgrid td{border:1px solid var(--rule);padding:4px 7px;
    text-align:center;font-size:12px;}
  .slotgrid th{background:var(--paper-alt);color:var(--ink-soft);}
  .empty{padding:36px 0;text-align:center;color:var(--ink-soft);font-size:14px;}
  footer{max-width:1080px;margin:0 auto;padding:0 20px 40px;
    color:var(--ink-soft);font-size:12px;}
  @media (max-width:640px){
    table.tt td{height:58px;} .c-subj{font-size:11.5px;}
    .c-tea,.c-room{font-size:9.5px;} table.tt th,table.tt td{padding:4px 2px;}
    .opts{grid-template-columns:1fr;}
  }
</style>
</head>

<div class="board">
  <div class="board-inner">
    <div>
      <p class="board-eyebrow">양일고등학교 · 고교학점제</p>

<main>

        <div class="spinner"></div>

      </div>
    </div>
  </section>

  <section class="panel" id="p-login">
    <div class="login-wrap">
      <div class="card">

        <p class="hint">학번 또는 교사 이름으로 로그인하세요.</p>

        </div>
        <div class="field">
          <label for="lpw">비밀번호</label>
          <input type="password" id="lpw" autocomplete="current-password">

        <button class="btn btn-primary" id="loginBtn" style="width:100%;">로그인</button>
        <div class="status" id="loginStatus"></div>
        <div class="login-note">
          <b>학생</b> — 아이디 <code>학번</code>, 비밀번호 <code>학번+1234</code> (예: 20101 / 201011234)<br>
          교사·관리자는 별도로 안내받은 계정으로 로그인하세요.
          <div id="modeNote" style="margin-top:10px;"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="panel" id="p-my"></section>
  <section class="panel" id="p-elective"></section>
  <section class="panel" id="p-homeroom"></section>
  <section class="panel" id="p-teachers"></section>
  <section class="panel" id="p-rooms"></section>
  <section class="panel" id="p-admin"></section>
</main>

<footer>
  <div id="foot"></div>
  <div style="margin-top:8px;">

</footer>

  if(FB){ await setDoc(doc(db,"students",sid), {choices: ch}, {merge:true}); return; }
  try{ localStorage.setItem(LS+"choices", JSON.stringify(CHOICES)); }
  catch(e){ mem.choices = CHOICES; }
}
let CHOICES = {};   // 학번 -> {blockId: courseKey}
let PATCH   = {};   // 시간표 수정분
let HOMEROOM= {};   // 교사명 -> "2-3"

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const full = a => DATA.subjectNames[a] || a;
const ckey = c => c.subj + c.code;
function roomOf(c){
  if(c.room) return c.room;
  const g = c.code[0], n = parseInt(c.code.slice(1),10);
  return (n>=1 && n<=8) ? `${g}학년 ${n}반 교실` : `${c.code}호`;
}
function homeCode(g,c){ return `${g}${String(c).padStart(2,"0")}`; }
function patched(list,kind){
  return list.map((s,i)=>{ const p = PATCH[`${kind}:${i}`]; return p ? {...s,...p} : s; });
}
function blocksNow(){
  return DATA.blocks.map((b,i)=>{
    const p = PATCH[`block:${i}`];
    return p ? {...b, courses:p.courses||b.courses, slots:p.slots||b.slots} : b;
  });
}

/* ---------- 시간표 계산 ---------- */
function studentGrid(grade, cls, choices){
  const home = homeCode(grade,cls), grid = {};
  patched(DATA.common,"common").forEach(s=>{
    if(s.code===home) grid[`${s.d}-${s.p}`] =
      {subj:s.subj, teacher:s.teacher, room:roomOf(s), code:s.code};
  });
  blocksNow().forEach(b=>{
    if(b.grade!==grade || !b.classes.includes(cls)) return;
    const c = b.courses.find(x=>ckey(x)===choices[b.id]);
    b.slots.forEach(([d,p])=>{
      const k = `${d}-${p}`;
      if(c) grid[k] = {subj:c.subj, teacher:c.teacher, room:roomOf(c), code:c.code, elective:true};
      else delete grid[k];
    });
  });
  return grid;
}
function teacherGrid(name){
  const grid = {};
  patched(DATA.common,"common").forEach(s=>{
    if(s.teacher===name) grid[`${s.d}-${s.p}`] =
      {subj:s.subj, teacher:name, room:roomOf(s), code:s.code};
  });
  blocksNow().forEach(b=>b.courses.forEach(c=>{
    if(c.teacher!==name) return;
    b.slots.forEach(([d,p])=>{ grid[`${d}-${p}`] =
      {subj:c.subj, teacher:name, room:roomOf(c), code:c.code, elective:true}; });
  }));
  return grid;
}
function allSessions(){
  const out = [];
  patched(DATA.common,"common").forEach(s=>out.push(
    {d:s.d,p:s.p,subj:s.subj,teacher:s.teacher,room:roomOf(s),code:s.code}));
  blocksNow().forEach(b=>b.courses.forEach(c=>b.slots.forEach(([d,p])=>out.push(
    {d,p,subj:c.subj,teacher:c.teacher,room:roomOf(c),code:c.code,elective:true}))));
  return out;
}
function defaultChoices(grade,cls){
  const home = homeCode(grade,cls), out = {};
  blocksNow().forEach(b=>{
    if(b.grade!==grade || !b.classes.includes(cls)) return;
    const own = b.courses.find(c=>c.code===home);
    if(own) out[b.id] = ckey(own);
  });
  return out;
}
function choicesFor(sid){
  if(CHOICES[sid]) return CHOICES[sid];
  const st = DATA.students[sid];
  if(st) return st.defaults;
  const g = +sid[0], c = +sid.slice(1,3);
  return defaultChoices(g,c);
}

/* ---------- 시간표 렌더 ---------- */
function renderTT(grid, opts){
  opts = opts || {};
  let h = `<table class="tt"><thead><tr><th class="pcol">교시</th>`;
  DAY_LABEL.forEach((d,i)=>h += `<th>${d}</th>`);
  h += `</tr></thead><tbody>`;
  for(let p=1;p<=DATA.periods;p++){
    h += `<tr><th class="pcol">${p}<small>${DATA.periodTimes[p-1]}</small></th>`;
    for(let d=0;d<5;d++){
      const c = grid[`${d}-${p}`];
      const move = c && opts.homeRoom && c.room !== opts.homeRoom;
      const cls = [d===TODAY_IDX?"today":"", move?"move":""].filter(Boolean).join(" ");
      h += `<td class="${cls}">`;
      if(c){
        h += `<div class="c-subj">${esc(full(c.subj))}</div>`;
        h += `<div class="c-tea">${esc(c.teacher)}</div>`;
        h += `<div class="c-room">${move?"↪ ":""}${esc(opts.showClass?classOf(c.code):c.room)}</div>`;
      } else h += `<span class="c-none">-</span>`;
      h += `</td>`;
    }
    h += `</tr>`;
  }
  return h + `</tbody></table>`;
}
function classOf(code){
  const g = code[0], n = parseInt(code.slice(1),10);
  return (n>=1&&n<=8) ? `${g}-${n}` : `${code}강좌`;
}

document.getElementById("loginBtn").onclick = doLogin;
document.getElementById("lpw").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });

async function doLogin(){
  const id = document.getElementById("lid").value.trim();
  const pw = document.getElementById("lpw").value;
  const st = document.getElementById("loginStatus");
  st.className = "status"; st.textContent = FB ? "확인 중…" : "";
  const fail = m => { st.textContent = m; st.classList.add("err"); };

  let role, email, user;
  if(id === "admin"){
    role = "admin"; email = "admin" + MAIL;
    user = {role, id, name:"관리자"};
  } else if(/^\d{5}$/.test(id)){
    const grade = +id[0], cls = +id.slice(1,3);
    if(grade<1||grade>3||cls<1||cls>8) return fail("학번 형식이 올바르지 않습니다.");
    role = "student"; email = "s" + id + MAIL;
    user = {role, id, grade, cls, name:"", inRoster: !!DATA.students[id]};
  } else {
    const m = mask(id);
    const ti = DATA.teachers.indexOf(m);
    if(ti < 0) return fail("등록되지 않은 아이디입니다.");
    role = "teacher"; email = "t" + String(ti+1).padStart(2,"0") + MAIL;
    user = {role, id:m, name:m};
  }

  if(FB){
    try{
      await signInWithEmailAndPassword(auth, email, pw);
    }catch(e){
      if(e.code === "auth/user-not-found" || e.code === "auth/invalid-credential"){
        try{ await createUserWithEmailAndPassword(auth, email, pw); }
        catch(e2){
          if(e2.code === "auth/email-already-in-use") return fail("비밀번호가 올바르지 않습니다.");
          if(e2.code === "auth/weak-password") return fail("비밀번호는 6자 이상이어야 합니다.");
          return fail("로그인 실패: " + e2.code);
        }
      } else if(e.code === "auth/wrong-password"){
        return fail("비밀번호가 올바르지 않습니다.");
      } else {
        return fail("로그인 실패: " + e.code);
      }
    }
    // 세션 복원은 onAuthStateChanged가 처리하므로 여기서는 추가 작업 없음
  } else {
    const expect = (role==="admin") ? "admin1234"
                  : (role==="teacher") ? "123456"
                  : id + "1234";
    if(pw !== expect) return fail("비밀번호가 올바르지 않습니다.");
    applyUser(user);
  }
}

function applyUser(user){
  USER = user;
  const st = document.getElementById("loginStatus");
  if(st) st.textContent = "";
  const w = document.getElementById("who");
  if(USER.role==="student")
    w.innerHTML = `<strong>${USER.id}</strong><br>${USER.grade}학년 ${USER.cls}반`;
  else if(USER.role==="teacher")
    w.innerHTML = `<strong>${esc(USER.name)} 선생님</strong><br>${HOMEROOM[USER.name]?HOMEROOM[USER.name]+" 담임":"교과 담당"}`;
  else w.innerHTML = `<strong>관리자</strong><br>교무부`;
  buildTabs();
  logVisit(USER);
}

function userFromEmail(email){
  if(email === "admin" + MAIL) return {role:"admin", id:"admin", name:"관리자"};
  const sm = email.match(/^s(\d{5})@/);
  if(sm){
    const id = sm[1], grade = +id[0], cls = +id.slice(1,3);
    return {role:"student", id, grade, cls, name:"", inRoster: !!DATA.students[id]};
  }
  const tm = email.match(/^t(\d+)@/);
  if(tm){
    const name = DATA.teachers[(+tm[1]) - 1];
    if(name) return {role:"teacher", id:name, name};
  }
  return null;
}

if(FB){
  onAuthStateChanged(auth, async (fbUser)=>{
    if(!fbUser){ showLoginScreen(); return; }
    const u = userFromEmail(fbUser.email || "");
    if(!u){ showLoginScreen(); return; }
    CHOICES = await loadChoices();
    PATCH = (await store.get("patch")) || {};
    const hr = await store.get("homeroom");
    HOMEROOM = (hr == null) ? {...DEFAULT_HOMEROOM} : hr;
    applyUser(u);
  });
}

function drawElective(){
  const el = document.getElementById("p-elective");
  const ch = {...choicesFor(USER.id)};
  const my = blocksNow().filter(b=>b.grade===USER.grade && b.classes.includes(USER.cls));
  if(!my.length){
    el.innerHTML = `<h2 class="sec">선택과목</h2>
      <div class="empty">${USER.grade}학년 ${USER.cls}반에는 선택 가능한 과목 묶음이 없습니다.</div>`;
    return;
  }
  el.innerHTML = `<h2 class="sec">선택과목 변경</h2>
    <p class="hint">같은 묶음 안의 과목들은 동시에 진행되므로 하나만 들을 수 있습니다.
      현재 신청 내역이 미리 선택되어 있습니다.</p>
    <div id="blocks">${my.map(b=>blockHTML(b,ch)).join("")}</div>
    <div class="row" style="margin-top:14px;">
      <button class="btn btn-primary" id="saveEl">저장</button>
      <button class="btn btn-ghost" id="resetEl">신청 내역으로 되돌리기</button>
      <span class="status" id="elStatus"></span>
    </div>`;

  el.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    const bid = o.dataset.b;
    ch[bid] = o.dataset.k || null;
    if(!o.dataset.k) delete ch[bid];
    el.querySelectorAll(`.opt[data-b="${bid}"]`).forEach(x=>{
      x.classList.toggle("sel", x===o);
      x.querySelector("input").checked = (x===o);
    });
  });
  document.getElementById("saveEl").onclick = async ()=>{
    const s = document.getElementById("elStatus");
    try{ await saveChoices(USER.id, ch); s.textContent = "저장했습니다."; s.className = "status ok"; }
    catch(e){ s.textContent = "저장 실패: " + e.message; s.className = "status err"; }
  };
  document.getElementById("resetEl").onclick = async ()=>{
    const st = DATA.students[USER.id];
    await saveChoices(USER.id, st ? st.defaults : defaultChoices(USER.grade, USER.cls));
    drawElective();
  };
}
function blockHTML(b,ch){
  const when = b.slots.map(([d,p])=>`${DAY_LABEL[d]}${p}`).join(" · ");
  const label = b.grp ? `${b.grp} 묶음` : `선택 묶음`;
  const opts = b.courses.map(c=>{
    const k = ckey(c), sel = ch[b.id]===k;
    return `<label class="opt ${sel?"sel":""}" data-b="${b.id}" data-k="${esc(k)}">
      <input type="radio" name="${b.id}" ${sel?"checked":""}>
      <span><span class="o-name">${esc(full(c.subj))}</span>
      <span class="o-meta">${esc(c.teacher)} · ${esc(roomOf(c))}</span></span></label>`;
  }).join("");
  const none = `<label class="opt ${!ch[b.id]?"sel":""}" data-b="${b.id}" data-k="">
      <input type="radio" name="${b.id}" ${!ch[b.id]?"checked":""}>
      <span><span class="o-name">선택 안 함</span>
      <span class="o-meta">이 시간 비움</span></span></label>`;
  return `<div class="block">
    <div class="block-head">
      <span class="block-title">${esc(label)}</span>
      <span class="block-when">${when} (주 ${b.slots.length}시간)</span>
    </div><div class="opts">${opts}${none}</div></div>`;
}

/* ---------- 담임 / 학생 조회 ---------- */
let hrPick = null;
function drawHomeroom(){
  const el = document.getElementById("p-homeroom");
  let grade, cls;
  if(USER.role==="teacher"){
    const hr = HOMEROOM[USER.name];
    if(!hr){
      el.innerHTML = `<h2 class="sec">우리 반 학생</h2>
        <div class="empty">담임 학급이 지정되어 있지 않습니다.<br>
        관리자(교무부)가 ‘시간표 관리 → 담임 지정’에서 학급을 연결해 주세요.</div>`;
      return;
    }
    [grade,cls] = hr.split("-").map(Number);
    el.innerHTML = `<h2 class="sec">${grade}학년 ${cls}반 학생 시간표</h2>` + rosterHTML(grade,cls);
  } else {
    if(!hrPick) hrPick = "2-1";
    [grade,cls] = hrPick.split("-").map(Number);
    let chips = "";
    for(let g=1;g<=3;g++) for(let c=1;c<=8;c++)
      chips += `<button class="${hrPick===`${g}-${c}`?"active":""}" data-v="${g}-${c}">${g}-${c}</button>`;
    el.innerHTML = `<h2 class="sec">학생 조회</h2><div class="chips">${chips}</div>` + rosterHTML(grade,cls);
    el.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{ hrPick=b.dataset.v; drawHomeroom(); });
  }
  bindRoster(el, grade, cls);
}
function rosterHTML(grade,cls){
  const ids = Object.keys(DATA.students).filter(id=>{
    const s = DATA.students[id]; return s.grade===grade && s.cls===cls;
  }).sort();
  if(!ids.length) return `<div class="empty">${grade}학년 ${cls}반 명단 데이터가 없습니다.<br>
    (현재 2학년 명단만 등록되어 있습니다.)</div>`;
  return `<div class="list" id="roster">${ids.map(id=>
    `<button data-id="${id}">${(+id.slice(3))}번 <span style="color:var(--ink-soft)">${id}</span></button>`).join("")}</div>
    <div id="rosterTT"></div>`;
}
function bindRoster(el,grade,cls){
  const box = el.querySelector("#roster"); if(!box) return;
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const id = b.dataset.id, s = DATA.students[id];
    const home = `${s.grade}학년 ${s.cls}반 교실`;
    el.querySelector("#rosterTT").innerHTML =
      `<h3 class="sub">${s.grade}학년 ${s.cls}반 ${(+id.slice(3))}번 · 학번 ${id}</h3>` +
      renderTT(studentGrid(s.grade,s.cls,choicesFor(id)),{homeRoom:home}) +
      `<div class="legend"><span><i style="background:var(--brass-tint);border-color:var(--brass)"></i>이동 수업</span></div>`;
    el.querySelector("#rosterTT").scrollIntoView({behavior:"smooth",block:"nearest"});
  });
}

/* ---------- 교실 사용 현황 ---------- */
let rPick = null;
function drawRooms(){
  const el = document.getElementById("p-rooms");
  const rooms = [...new Set(allSessions().map(s=>s.room))].sort((a,b)=>{
    const sa = /교실$/.test(a), sb = /교실$/.test(b);
    if(sa!==sb) return sa?1:-1; return a.localeCompare(b,"ko");
  });
  if(!rPick) rPick = rooms[0];
  el.innerHTML = `<h2 class="sec">교실 사용 현황</h2>
    <p class="hint">특별실·외부 강의실이 위쪽에 있습니다. 같은 시간에 두 수업이 겹치면 빨간 글씨로 표시됩니다.</p>
    <div class="row" style="margin-bottom:16px;">
      <select id="rsel">${rooms.map(r=>
        `<option ${r===rPick?"selected":""}>${esc(r)}</option>`).join("")}</select>
    </div><div id="rtt"></div>`;
  const draw = ()=>{
    const grid = {};
    allSessions().filter(s=>s.room===rPick).forEach(s=>{
      const k = `${s.d}-${s.p}`; (grid[k] = grid[k]||[]).push(s);
    });
    let h = `<table class="tt"><thead><tr><th class="pcol">교시</th>`;
    DAY_LABEL.forEach(d=>h+=`<th>${d}</th>`); h += `</tr></thead><tbody>`;
    for(let p=1;p<=DATA.periods;p++){
      h += `<tr><th class="pcol">${p}<small>${DATA.periodTimes[p-1]}</small></th>`;
      for(let d=0;d<5;d++){
        const cs = grid[`${d}-${p}`]||[];
        const conf = cs.length>1;
        h += `<td class="${d===TODAY_IDX?"today":""}">`;
        if(!cs.length) h += `<span class="c-none">-</span>`;
        else h += cs.map(c=>`<div class="c-subj" ${conf?'style="color:var(--err)"':""}>${esc(full(c.subj))}</div>
          <div class="c-tea">${esc(c.teacher)} · ${esc(classOf(c.code))}</div>`).join("") +
          (conf?`<div class="c-room" style="color:var(--err);font-weight:700">중복</div>`:"");
        h += `</td>`;
      }
      h += `</tr>`;
    }
    document.getElementById("rtt").innerHTML = h + `</tbody></table>`;
  };
  document.getElementById("rsel").onchange = e=>{ rPick = e.target.value; draw(); };
  draw();
}

/* ---------- 관리자 ---------- */
let aTab = "common", aClass = "1-1", aBlock = 0;
function drawAdmin(){
  const el = document.getElementById("p-admin");
  el.innerHTML = `<h2 class="sec">시간표 관리</h2>
    <div class="chips" id="aTabs">
      <button data-v="common" class="${aTab==="common"?"active":""}">학급 공통시간표</button>
      <button data-v="block" class="${aTab==="block"?"active":""}">선택과목 묶음</button>
      <button data-v="hr" class="${aTab==="hr"?"active":""}">담임 지정</button>
      <button data-v="io" class="${aTab==="io"?"active":""}">데이터 백업</button>
      <button data-v="visits" class="${aTab==="visits"?"active":""}">접속 현황</button>
    </div><div id="aBody"></div>`;
  el.querySelectorAll("#aTabs button").forEach(b=>b.onclick=()=>{ aTab=b.dataset.v; drawAdmin(); });
  ({common:adminCommon, block:adminBlock, hr:adminHR, io:adminIO, visits:adminVisits})[aTab]();
}

function adminCommon(){
  const box = document.getElementById("aBody");
  let chips = "";
  for(let g=1;g<=3;g++) for(let c=1;c<=8;c++)
    chips += `<button class="${aClass===`${g}-${c}`?"active":""}" data-v="${g}-${c}">${g}-${c}</button>`;
  const [g,c] = aClass.split("-").map(Number);
  const home = homeCode(g,c);
  const idx = [];
  DATA.common.forEach((s,i)=>{ if(s.code===home) idx.push(i); });
  const cur = {};
  idx.forEach(i=>{ const s = patched(DATA.common,"common")[i]; cur[`${s.d}-${s.p}`] = {i,s}; });

  let h = `<p class="hint">학급 전체가 함께 듣는 공통 과목만 여기서 수정합니다.
    선택과목은 ‘선택과목 묶음’ 탭에서 관리하세요.</p>
    <div class="chips">${chips}</div>
    <table class="tt"><thead><tr><th class="pcol">교시</th>`;
  DAY_LABEL.forEach(d=>h+=`<th>${d}</th>`); h += `</tr></thead><tbody>`;
  for(let p=1;p<=DATA.periods;p++){
    h += `<tr><th class="pcol">${p}</th>`;
    for(let d=0;d<5;d++){
      const e = cur[`${d}-${p}`];
      h += `<td>` + (e ? `
        <input class="edit-in" data-i="${e.i}" data-f="subj" value="${esc(e.s.subj)}">
        <input class="edit-in small" data-i="${e.i}" data-f="teacher" value="${esc(e.s.teacher)}">
        <input class="edit-in small" data-i="${e.i}" data-f="room" value="${esc(e.s.room)}" placeholder="교실(비우면 반 교실)">`
        : `<span class="c-none">-</span>`) + `</td>`;
    }
    h += `</tr>`;
  }
  h += `</tbody></table>
    <div class="row" style="margin-top:14px;">
      <button class="btn btn-primary" id="saveC">저장</button>
      <span class="status" id="cStatus"></span></div>`;
  box.innerHTML = h;
  box.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{ aClass=b.dataset.v; adminCommon(); });
  document.getElementById("saveC").onclick = async ()=>{
    box.querySelectorAll(".edit-in").forEach(inp=>{
      const k = `common:${inp.dataset.i}`;
      PATCH[k] = PATCH[k]||{}; PATCH[k][inp.dataset.f] = inp.value.trim();
    });
    await store.set("patch", PATCH);
    const s = document.getElementById("cStatus");
    s.textContent = "저장했습니다."; s.className="status ok";
  };
}

function adminBlock(){
  const box = document.getElementById("aBody");
  const bs = blocksNow();
  const b = bs[aBlock];
  const opts = bs.map((x,i)=>{
    const nm = x.courses.map(c=>full(c.subj)).join(", ");
    return `<option value="${i}" ${i===aBlock?"selected":""}>${x.grade}학년 ${x.grp?x.grp+"묶음 ":""}[${x.classes.join(",")}반] ${esc(nm.slice(0,30))}</option>`;
  }).join("");
  let slot = `<table class="slotgrid"><tr><th></th>` +
    DAY_LABEL.map(d=>`<th>${d}</th>`).join("") + `</tr>`;
  for(let p=1;p<=DATA.periods;p++){
    slot += `<tr><th>${p}</th>` + DAY_LABEL.map((_,d)=>{
      const on = b.slots.some(s=>s[0]===d && s[1]===p);
      return `<td><input type="checkbox" class="sl" data-d="${d}" data-p="${p}" ${on?"checked":""}></td>`;
    }).join("") + `</tr>`;
  }
  slot += `</table>`;
  box.innerHTML = `<p class="hint">같은 묶음의 과목은 동시에 진행됩니다. 수업 시간을 바꾸면 이 묶음의 모든 과목이 함께 이동합니다.</p>
    <div class="row" style="margin-bottom:16px;"><select id="bsel" style="max-width:100%">${opts}</select></div>
    <h3 class="sub">개설 과목</h3>
    ${b.courses.map((c,ci)=>`<div class="block"><div class="row">
      <input type="text" class="bc" data-ci="${ci}" data-f="subj" value="${esc(c.subj)}" style="width:110px">
      <input type="text" class="bc" data-ci="${ci}" data-f="teacher" value="${esc(c.teacher)}" style="width:110px">
      <input type="text" class="bc" data-ci="${ci}" data-f="room" value="${esc(c.room)}" placeholder="교실(비우면 ${esc(classOf(c.code))} 교실)" style="flex:1;min-width:180px">
      <span class="block-when">코드 ${c.code}</span></div></div>`).join("")}
    <h3 class="sub">수업 시간</h3>${slot}
    <div class="row" style="margin-top:14px;">
      <button class="btn btn-primary" id="saveB">저장</button>
      <span class="status" id="bStatus"></span></div>`;
  document.getElementById("bsel").onchange = e=>{ aBlock = +e.target.value; adminBlock(); };
  document.getElementById("saveB").onclick = async ()=>{
    const courses = b.courses.map(c=>({...c}));
    box.querySelectorAll(".bc").forEach(inp=>{ courses[+inp.dataset.ci][inp.dataset.f] = inp.value.trim(); });
    const slots = [];
    box.querySelectorAll(".sl:checked").forEach(cb=>slots.push([+cb.dataset.d, +cb.dataset.p]));
    PATCH[`block:${aBlock}`] = {courses, slots};
    await store.set("patch", PATCH);
    const s = document.getElementById("bStatus");
    s.textContent = "저장했습니다."; s.className="status ok";
  };
}

function adminHR(){
  const box = document.getElementById("aBody");
  const classes = [];
  for(let g=1;g<=3;g++) for(let c=1;c<=8;c++) classes.push(`${g}-${c}`);
  box.innerHTML = `<p class="hint">담임으로 지정된 교사는 로그인 시 ‘우리 반 학생’ 탭에서 학급 학생들의 개인 시간표를 볼 수 있습니다.</p>
    <div class="list">${DATA.teachers.map(t=>`
      <div style="background:#fff;border:1px solid var(--rule);padding:9px;">
        <div style="font-size:13.5px;font-weight:600;margin-bottom:5px;">${esc(t)}</div>
        <select class="hr" data-t="${esc(t)}" style="width:100%;font-size:13px;padding:5px;">
          <option value="">— 담임 아님 —</option>
          ${classes.map(c=>`<option ${HOMEROOM[t]===c?"selected":""}>${c}</option>`).join("")}
        </select></div>`).join("")}</div>
    <div class="row" style="margin-top:14px;">
      <button class="btn btn-primary" id="saveH">저장</button>

    s.textContent = "저장했습니다."; s.className="status ok";

}

function adminIO(){
  const box = document.getElementById("aBody");
  box.innerHTML = `<p class="hint">수정 내용(시간표 변경·담임 지정·학생 선택과목)을 파일로 내보내고 다시 불러올 수 있습니다.
    Firebase를 연결하기 전까지는 이 방법으로 백업하세요.</p>
    <div class="row">
      <button class="btn btn-primary" id="exp">내보내기</button>
      <button class="btn btn-ghost" id="impBtn">불러오기</button>
      <input type="file" id="imp" accept="application/json" style="display:none">
      <button class="btn btn-danger" id="clr">모든 수정 초기화</button>
      <span class="status" id="ioStatus"></span></div>`;
  document.getElementById("exp").onclick = ()=>{
    const blob = new Blob([JSON.stringify({PATCH,HOMEROOM,CHOICES},null,1)],
      {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "시간표_수정본.json"; a.click();
  };
  document.getElementById("impBtn").onclick = ()=>document.getElementById("imp").click();
  document.getElementById("imp").onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = async ()=>{
      try{
        const j = JSON.parse(r.result);
        PATCH = j.PATCH||{}; HOMEROOM = j.HOMEROOM||{}; CHOICES = j.CHOICES||{};
        await store.set("patch",PATCH); await store.set("homeroom",HOMEROOM);
        await store.set("choices",CHOICES);
        const s = document.getElementById("ioStatus");
        s.textContent = "불러왔습니다."; s.className="status ok";
      }catch(err){
        const s = document.getElementById("ioStatus");
        s.textContent = "파일을 읽지 못했습니다."; s.className="status err";
      }
    };
    r.readAsText(f);
  };
  document.getElementById("clr").onclick = async ()=>{
    if(!confirm("모든 수정 내용을 지우고 원본 시간표로 되돌릴까요?")) return;
    PATCH={}; HOMEROOM={}; CHOICES={};
    await store.set("patch",{}); await store.set("homeroom",{}); await store.set("choices",{});
    const s = document.getElementById("ioStatus");
    s.textContent = "초기화했습니다."; s.className="status ok";
  };
}

async function adminVisits(){
  const box = document.getElementById("aBody");
  if(!FB){
    box.innerHTML = `<div class="empty">Firebase 연결 전에는 접속 기록이 남지 않습니다.</div>`;
    return;
  }
  box.innerHTML = `<div class="empty">불러오는 중…</div>`;

  const [studentDocs, logDocs] = await Promise.all([
    getDocs(collection(db,"students")),
    getDocs(collection(db,"visitLog"))
  ]);
  const everLogged = new Set();
  studentDocs.forEach(d=>{ if(d.data().lastLogin) everLogged.add(d.id); });

  const logs = [];
  logDocs.forEach(d=>logs.push(d.data()));
  logs.sort((a,b)=> (b.ts||0) - (a.ts||0));

  const startOfToday = new Date(); startOfToday.setHours(0,0,0,0);
  const todayCount = logs.filter(l=>l.ts >= startOfToday.getTime()).length;
  const todayUnique = new Set(logs.filter(l=>l.ts >= startOfToday.getTime()).map(l=>l.sid)).size;

  const byGrade = {1:{total:0,seen:0},2:{total:0,seen:0},3:{total:0,seen:0}};
  Object.entries(DATA.students).forEach(([sid,s])=>{
    byGrade[s.grade].total++;
    if(everLogged.has(sid)) byGrade[s.grade].seen++;
  });

  const neverList = Object.entries(DATA.students)
    .filter(([sid])=>!everLogged.has(sid))
    .map(([sid,s])=>({sid, grade:s.grade, cls:s.cls}))
    .sort((a,b)=> a.sid.localeCompare(b.sid));

  const gradeRows = [1,2,3].map(g=>{
    const {total,seen} = byGrade[g];
    const pct = total ? Math.round(seen/total*100) : 0;
    return `<tr><td style="text-align:left;padding:6px 4px;">${g}학년</td>
      <td style="text-align:right;padding:6px 4px;">${seen} / ${total}명</td>
      <td style="text-align:right;padding:6px 4px;color:var(--ink-soft);">${pct}%</td></tr>`;
  }).join("");

  const recentRows = logs.slice(0,30).map(l=>{
    const d = new Date(l.ts);
    const label = l.role==="student" ? `학번 ${l.sid}`
                : l.role==="teacher" ? `${l.sid} 선생님`
                : "관리자";
    return `<tr><td style="padding:5px 4px;">${label}</td>
      <td style="padding:5px 4px;color:var(--ink-soft);">${d.toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}</td></tr>`;
  }).join("");

  const neverHTML = neverList.length
    ? `<div class="list">${neverList.map(n=>`<button disabled style="cursor:default;">${n.grade}-${n.cls} ${n.sid.slice(3)}번</button>`).join("")}</div>`
    : `<div class="empty">전원 로그인 기록이 있습니다.</div>`;

  box.innerHTML = `
    <h3 class="sub" style="margin-top:0;">오늘 접속</h3>
    <p style="font-size:26px;font-weight:700;margin:0 0 4px;">${todayUnique}<span style="font-size:14px;font-weight:400;color:var(--ink-soft);"> 명 (총 ${todayCount}회)</span></p>

    <h3 class="sub">학년별 로그인 이력(누적)</h3>
    <table class="tt" style="max-width:420px;"><tbody>${gradeRows}</tbody></table>

    <h3 class="sub">한 번도 로그인 안 한 학생 (${neverList.length}명)</h3>
    ${neverHTML}

    <h3 class="sub">최근 접속 30건</h3>
    <table class="tt"><tbody>${recentRows || '<tr><td class="empty">기록 없음</td></tr>'}</tbody></table>
    <p class="hint" style="margin-top:14px;">접속 기록은 로그인할 때마다 하나씩 쌓입니다. 학기 말에 너무 많아지면 Firestore 콘솔에서 visitLog 컬렉션을 통째로 비워도 학생 데이터에는 영향 없습니다.</p>
  `;
}
